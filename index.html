<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>做单信息查询表</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #667085;
      --soft: #eef1f4;
      --line: #d9dee7;
      --accent: #0f766e;
      --accent-soft: #e7f4f2;
      --notice: #fff8e6;
      --notice-line: #f0c36d;
      --shadow: 0 18px 50px rgba(16, 24, 40, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 34px 22px 44px;
    }

    .hero {
      display: grid;
      gap: 8px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .selector {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .selector-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .currencies {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 8px;
    }

    .currency {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #263241;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, color .16s ease, transform .16s ease;
    }

    .currency:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .currency.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0 12px;
    }

    .result-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .copy {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #263241;
      padding: 0 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-top {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }

    .psp {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
    }

    .title-line {
      display: block;
      min-width: 0;
    }

    .status-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 7px;
      min-width: 0;
      margin-top: 10px;
    }

    .time {
      min-width: 118px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8fafc;
      text-align: right;
    }

    .time span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .time strong {
      display: block;
      color: var(--accent);
      font-size: 15px;
      line-height: 1.25;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #475467;
      font-size: 12px;
    }

    .chip.gold {
      background: #fff7e6;
      color: #a15c07;
      border: 1px solid #ffd591;
      font-weight: 700;
    }

    .extra-tags {
      min-height: 34px;
      padding: 0 16px 10px;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--soft);
    }

    .default-mark {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #fff1f0;
      color: #b42318;
      border: 1px solid #ffccc7;
      font-size: 12px;
      font-weight: 700;
    }

    .card-body {
      padding: 16px;
    }

    .compliance-note {
      margin: 0;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--notice);
      border: 1px solid var(--notice-line);
      color: #5f4b1b;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 12px 34px rgba(160, 112, 24, .12);
    }

    .compliance-note strong {
      color: #7a4d00;
      font-weight: 800;
    }

    .notice-stack {
      display: grid;
      gap: 10px;
    }

    .section {
      margin: 0 0 10px;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    .materials {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 9px;
    }

    .materials li {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      color: #1f2937;
      font-size: 14px;
      line-height: 1.5;
    }

    .num {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      display: inline-grid;
      place-items: center;
      margin-top: 1px;
    }

    .empty {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }

    @media (max-width: 760px) {
      .page {
        padding: 22px 14px 34px;
      }

      h1 {
        font-size: 23px;
      }

      .selector {
        padding: 13px;
      }

      .currencies {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card-top {
        grid-template-columns: 1fr;
      }

      .status-tags {
        justify-content: flex-start;
        min-width: 0;
      }

      .time {
        width: 100%;
        text-align: left;
      }

      .result-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .copy {
        width: 100%;
      }
    }

    @media (max-width: 380px) {
      .currencies {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>做单信息查询表</h1>
      <div class="notice-stack">
        <p class="compliance-note"><strong>合规材料说明：</strong>页面展示的材料为 PSP 支付处理所需的基础合规文件。实际做单过程中，内部合规会结合客户背景、交易金额、资金来源、交易目的及交易链路，视情况要求补充佐证材料。</p>
        <p class="compliance-note"><strong>提前出号说明：</strong>页面展示的最早出账号时间为常规处理时效。如客户因时区或付款安排需要提前获取账号，可按早间指导价基础上加收 0.3% 作为汇率波动风险缓冲后对客报价。</p>
      </div>
    </section>

    <section class="selector" aria-label="币种选择">
      <div class="selector-head">
        <span class="label">选择币种</span>
        <span class="count" id="count"></span>
      </div>
      <div class="currencies" id="currencies"></div>
    </section>

    <div class="result-bar">
      <h2 class="result-title" id="resultTitle"></h2>
      <button class="copy" id="copyBtn" type="button">复制当前结果</button>
    </div>

    <section class="cards" id="cards" aria-live="polite"></section>
  </main>

  <script>
    const PSP_LIST = [
      {
        name: "PSP Stephen",
        defaultFor: ["USD", "HKD"],
        labels: ["黄金户", "固定户", "普通户"],
        currencies: ["USD", "HKD"],
        accountTime: "悉尼时间 11 点左右",
        materials: [
          "身份证（正反面清晰照片或扫描件）",
          "护照（个人信息页清晰照片或扫描件）",
          "近三个月地址证明（任选其一：水电费账单 Utility Bill、银行账单 Bank Statement、其他官方认可的地址证明）"
        ]
      },
      {
        name: "PSP VC",
        labels: ["黄金户", "固定户", "普通户"],
        currencies: ["USD", "HKD"],
        accountTime: "悉尼时间 11 点左右",
        materials: [
          "身份证（正反面清晰照片或扫描件）",
          "护照（个人信息页清晰照片或扫描件）",
          "近三个月地址证明（任选其一：水电费账单 Utility Bill、银行账单 Bank Statement、其他官方认可的地址证明）"
        ]
      },
      {
        name: "PSP 公户",
        labels: ["普通户"],
        currencies: ["USD", "HKD"],
        accountTime: "悉尼时间 11 点左右",
        materials: [
          "身份证（正反面清晰照片或扫描件）",
          "护照（个人信息页清晰照片或扫描件）"
        ]
      },
      {
        name: "PSP CA",
        defaultFor: ["CAD", "CHF", "EUR", "GBP", "SGD", "THB", "JPY", "KRW", "AED", "IDR"],
        labels: ["黄金户", "固定户", "普通户"],
        currencies: ["USD", "CAD", "CHF", "EUR", "GBP", "HKD", "SGD", "THB", "JPY", "KRW", "AED", "IDR"],
        accountTime: "悉尼时间 11 点左右",
        materials: [
          "身份证（正反面清晰照片或扫描件）",
          "护照（个人信息页清晰照片或扫描件）",
          "近三个月境外地址证明（任选其一：水电费账单 Utility Bill、银行账单 Bank Statement、其他官方认可的地址证明）",
          "近三个月完整银行流水（Bank Statement）",
          "账户余额及流水需能够覆盖本次做单金额",
          "电话/邮箱"
        ]
      },
      {
        name: "PSP CA",
        defaultFor: ["AUD"],
        labels: ["黄金户", "固定户", "普通户"],
        currencies: ["AUD"],
        accountTime: "悉尼时间 11 点左右",
        materials: [
          "身份证（正反面清晰照片或扫描件）",
          "护照（个人信息页清晰照片或扫描件）",
          "电话/邮箱"
        ]
      },
      {
        name: "PSP 麦瑞兹",
        labels: ["普通户"],
        currencies: ["AUD", "USD", "CAD", "CHF", "EUR", "GBP", "HKD", "SGD", "THB", "JPY", "KRW", "AED", "IDR"],
        accountTime: "悉尼时间 12:30 左右",
        materials: [
          "身份证（正反面清晰照片或扫描件）",
          "护照（个人信息页清晰照片或扫描件）",
          "近三个月完整银行流水（Bank Statement）",
          "账户余额及流水需能够覆盖本次做单金额",
          "电话/邮箱"
        ]
      }
    ];

    const preferredOrder = ["USD", "HKD", "AUD", "CAD", "EUR", "GBP", "SGD", "JPY", "CHF", "THB", "KRW", "AED", "IDR"];
    const currencies = [...new Set(PSP_LIST.flatMap((psp) => psp.currencies))]
      .sort((a, b) => preferredOrder.indexOf(a) - preferredOrder.indexOf(b));
    let selectedCurrency = "USD";

    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderCurrencies() {
      $("currencies").innerHTML = currencies.map((currency) => `
        <button class="currency ${currency === selectedCurrency ? "active" : ""}" type="button" data-currency="${currency}">
          ${currency}
        </button>
      `).join("");
    }

    function currentResults() {
      return PSP_LIST
        .filter((psp) => psp.currencies.includes(selectedCurrency))
        .sort((a, b) => Number(isDefault(b)) - Number(isDefault(a)));
    }

    function isDefault(psp) {
      return psp.defaultFor?.includes(selectedCurrency);
    }

    function renderCards() {
      const results = currentResults();
      $("resultTitle").textContent = `${selectedCurrency} 可用 PSP`;
      $("count").textContent = `${results.length} 个 PSP`;

      if (!results.length) {
        $("cards").innerHTML = `<div class="empty">当前币种暂无可用 PSP。</div>`;
        return;
      }

      $("cards").innerHTML = results.map((psp) => `
        <article class="card">
          <div class="card-top">
            <div>
              <h3 class="psp">${escapeHtml(psp.name)}</h3>
              <div class="status-tags">
                ${isDefault(psp) ? `<span class="default-mark">默认出款方式</span>` : ""}
              </div>
              <div class="chips">
                ${psp.currencies.map((currency) => `<span class="chip">${escapeHtml(currency)}</span>`).join("")}
              </div>
            </div>
            <div class="time">
              <span>最早出账号</span>
              <strong>${escapeHtml(psp.accountTime)}</strong>
            </div>
          </div>
          <div class="extra-tags">
            ${(psp.labels || []).map((label) => `<span class="chip gold">${escapeHtml(label)}</span>`).join("")}
          </div>
          <div class="card-body">
            <p class="section">支付必须材料</p>
            <ul class="materials">
              ${psp.materials.map((item, index) => `
                <li><span class="num">${index + 1}</span><span>${escapeHtml(item)}</span></li>
              `).join("")}
            </ul>
          </div>
        </article>
      `).join("");
    }

    function resultText() {
      return currentResults().map((psp) => [
        `${psp.name}`,
        `币种：${selectedCurrency}`,
        `最早出账号时间：${psp.accountTime}`,
        "支付必须材料：",
        ...psp.materials.map((item, index) => `${index + 1}. ${item}`),
        ""
      ].join("\n")).join("\n");
    }

    $("currencies").addEventListener("click", (event) => {
      const button = event.target.closest("[data-currency]");
      if (!button) return;
      selectedCurrency = button.dataset.currency;
      renderCurrencies();
      renderCards();
    });

    $("copyBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(resultText());
      $("copyBtn").textContent = "已复制";
      setTimeout(() => {
        $("copyBtn").textContent = "复制当前结果";
      }, 1200);
    });

    renderCurrencies();
    renderCards();
  </script>
</body>
</html>
